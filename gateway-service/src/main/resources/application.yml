server:
  port: 8080
spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8889
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32}
