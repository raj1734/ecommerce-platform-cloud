openapi: 3.0.3
info:
  title: API Gateway
  description: |
    Unified API Gateway for E-Commerce Microservices Platform
    
    The API Gateway serves as the single entry point for all client requests, providing:
    - **Centralized Routing**: Routes requests to appropriate microservices
    - **JWT Authentication**: Validates JWT tokens and propagates user context
    - **Rate Limiting**: Redis-backed token bucket rate limiting per service
    - **CORS Handling**: Cross-Origin Resource Sharing configuration
    - **Load Balancing**: Distributes requests across service instances
    
    All requests to backend services must go through this gateway at `http://localhost:8080`.
  version: 1.0.0
  contact:
    name: E-Commerce Platform Team
    email: team@ecommerce.com

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.ecommerce.com
    description: Production

tags:
  - name: Authentication
    description: User authentication and authorization endpoints (routed to Auth Service)
  - name: Products
    description: Product catalog management endpoints (routed to Catalog Service)
  - name: Orders
    description: Order processing endpoints (routed to Order Service)
  - name: Gateway Management
    description: Gateway health and metrics endpoints

paths:
  # ==========================================
  # Authentication Service Routes (/api/auth/**)
  # Rate Limit: 10 requests/second, burst 20
  # ==========================================
  
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: |
        Create a new user account and receive JWT token.
        
        **Route Details:**
        - Target Service: Auth Service (port 8081)
        - Rate Limit: 10 req/s, burst capacity 20
        - Authentication: Not required
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: john.doe@example.com
              password: SecurePass123!
              firstName: John
              lastName: Doe
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Number of requests remaining in current window
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Time when rate limit resets (Unix timestamp)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: |
        Authenticate user and receive JWT token.
        
        **Route Details:**
        - Target Service: Auth Service (port 8081)
        - Rate Limit: 10 req/s, burst capacity 20
        - Authentication: Not required
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: john.doe@example.com
              password: SecurePass123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/auth/validate:
    get:
      tags:
        - Authentication
      summary: Validate JWT token
      description: |
        Check if JWT token is valid.
        
        **Route Details:**
        - Target Service: Auth Service (port 8081)
        - Rate Limit: 10 req/s, burst capacity 20
        - Authentication: Required (Bearer token)
      operationId: validateToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  # ==========================================
  # Catalog Service Routes (/api/catalog/**)
  # Rate Limit: 50 requests/second, burst 100
  # ==========================================
  
  /api/catalog/products:
    get:
      tags:
        - Products
      summary: Get all products
      description: |
        Retrieve all active products (cached in Redis).
        
        **Route Details:**
        - Target Service: Catalog Service (port 8082)
        - Rate Limit: 50 req/s, burst capacity 100
        - Authentication: Not required
        - Caching: Redis cache-aside pattern (10-minute TTL)
      operationId: getAllProducts
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
    
    post:
      tags:
        - Products
      summary: Create new product
      description: |
        Create a new product in the catalog.
        
        **Route Details:**
        - Target Service: Catalog Service (port 8082)
        - Rate Limit: 50 req/s, burst capacity 100
        - Authentication: Required (Bearer token)
        - User Context: X-User-Id and X-User-Email headers added by gateway
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
            example:
              name: Wireless Mouse
              description: Ergonomic wireless mouse with USB receiver
              price: 29.99
              stock: 100
              category: Electronics
              imageUrl: https://example.com/images/mouse.jpg
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/catalog/products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      description: |
        Retrieve a single product by its ID (cached in Redis).
        
        **Route Details:**
        - Target Service: Catalog Service (port 8082)
        - Rate Limit: 50 req/s, burst capacity 100
        - Authentication: Not required
        - Caching: Redis cache-aside pattern (10-minute TTL)
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the product
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
    
    put:
      tags:
        - Products
      summary: Update product
      description: |
        Update an existing product.
        
        **Route Details:**
        - Target Service: Catalog Service (port 8082)
        - Rate Limit: 50 req/s, burst capacity 100
        - Authentication: Required (Bearer token)
        - Cache Eviction: Invalidates Redis cache on update
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the product
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
    
    delete:
      tags:
        - Products
      summary: Delete product
      description: |
        Soft delete a product (sets active=false).
        
        **Route Details:**
        - Target Service: Catalog Service (port 8082)
        - Rate Limit: 50 req/s, burst capacity 100
        - Authentication: Required (Bearer token)
        - Cache Eviction: Invalidates Redis cache on delete
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the product
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      responses:
        '204':
          description: Product deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/catalog/products/category/{category}:
    get:
      tags:
        - Products
      summary: Get products by category
      description: |
        Retrieve all products in a specific category (cached in Redis).
        
        **Route Details:**
        - Target Service: Catalog Service (port 8082)
        - Rate Limit: 50 req/s, burst capacity 100
        - Authentication: Not required
        - Caching: Redis cache-aside pattern (10-minute TTL)
      operationId: getProductsByCategory
      parameters:
        - name: category
          in: path
          required: true
          description: Product category name
          schema:
            type: string
            example: Electronics
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/catalog/products/search:
    get:
      tags:
        - Products
      summary: Search products by name
      description: |
        Search products by name using MongoDB text search.
        
        **Route Details:**
        - Target Service: Catalog Service (port 8082)
        - Rate Limit: 50 req/s, burst capacity 100
        - Authentication: Not required
      operationId: searchProducts
      parameters:
        - name: name
          in: query
          required: true
          description: Product name to search for
          schema:
            type: string
            example: mouse
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  # ==========================================
  # Order Service Routes (/api/orders/**)
  # Rate Limit: 20 requests/second, burst 40
  # ==========================================
  
  /api/orders:
    post:
      tags:
        - Orders
      summary: Create new order
      description: |
        Create a new order with product validation and Kafka event publishing.
        
        **Route Details:**
        - Target Service: Order Service (port 8083)
        - Rate Limit: 20 req/s, burst capacity 40
        - Authentication: Required (Bearer token)
        - User Context: X-User-Id and X-User-Email headers added by gateway
        - Circuit Breaker: Resilience4j protection for Catalog Service calls
        - Event Publishing: OrderCreatedEvent published to Kafka
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              items:
                - productId: 507f1f77bcf86cd799439011
                  quantity: 2
                - productId: 507f1f77bcf86cd799439012
                  quantity: 1
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: Service unavailable - Circuit breaker open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      description: |
        Retrieve a specific order by its ID.
        
        **Route Details:**
        - Target Service: Order Service (port 8083)
        - Rate Limit: 20 req/s, burst capacity 40
        - Authentication: Required (Bearer token)
        - User Context: X-User-Id header added by gateway
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/orders/user/{userId}:
    get:
      tags:
        - Orders
      summary: Get orders by user ID
      description: |
        Retrieve all orders for a specific user.
        
        **Route Details:**
        - Target Service: Order Service (port 8083)
        - Rate Limit: 20 req/s, burst capacity 40
        - Authentication: Required (Bearer token)
        - User Context: X-User-Id header added by gateway
      operationId: getOrdersByUserId
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/orders/{id}/status:
    put:
      tags:
        - Orders
      summary: Update order status
      description: |
        Update the status of an existing order.
        
        **Route Details:**
        - Target Service: Order Service (port 8083)
        - Rate Limit: 20 req/s, burst capacity 40
        - Authentication: Required (Bearer token)
        - User Context: X-User-Id header added by gateway
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
            format: int64
            example: 1
        - name: status
          in: query
          required: true
          description: New order status
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  # ==========================================
  # Gateway Management Endpoints
  # ==========================================
  
  /actuator/health:
    get:
      tags:
        - Gateway Management
      summary: Gateway health check
      description: Check the health status of the API Gateway
      operationId: getHealth
      responses:
        '200':
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  components:
                    type: object
                    properties:
                      redis:
                        type: object
                        properties:
                          status:
                            type: string
                            example: UP
        '503':
          description: Gateway is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: DOWN

  /actuator/prometheus:
    get:
      tags:
        - Gateway Management
      summary: Prometheus metrics
      description: Expose Prometheus metrics for monitoring
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP gateway_requests_total Total number of requests
                  # TYPE gateway_requests_total counter
                  gateway_requests_total{route="auth-service"} 1234
                  gateway_requests_total{route="catalog-service"} 5678

components:
  schemas:
    # ==========================================
    # Authentication Schemas
    # ==========================================
    
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          description: User email address (must be unique)
          example: john.doe@example.com
        password:
          type: string
          format: password
          minLength: 6
          description: User password (minimum 6 characters)
          example: SecurePass123!
        firstName:
          type: string
          description: User first name
          example: John
        lastName:
          type: string
          description: User last name
          example: Doe

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: john.doe@example.com
        password:
          type: string
          format: password
          description: User password
          example: SecurePass123!

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token (valid for 24 hours)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwiZW1haWwiOiJqb2huLmRvZUBleGFtcGxlLmNvbSIsInJvbGUiOiJVU0VSIiwiaWF0IjoxNjQwOTk1MjAwLCJleHAiOjE2NDEwODE2MDB9.signature
        email:
          type: string
          format: email
          description: User email address
          example: john.doe@example.com
        role:
          type: string
          description: User role
          example: USER

    # ==========================================
    # Product Schemas
    # ==========================================
    
    ProductRequest:
      type: object
      required:
        - name
        - price
        - stock
        - category
      properties:
        name:
          type: string
          description: Product name
          example: Wireless Mouse
        description:
          type: string
          description: Product description
          example: Ergonomic wireless mouse with USB receiver
        price:
          type: number
          format: double
          minimum: 0.01
          description: Product price in USD
          example: 29.99
        stock:
          type: integer
          minimum: 0
          description: Available stock quantity
          example: 100
        category:
          type: string
          description: Product category
          example: Electronics
        imageUrl:
          type: string
          format: uri
          description: Product image URL
          example: https://example.com/images/mouse.jpg

    Product:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectId
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: Product name
          example: Wireless Mouse
        description:
          type: string
          description: Product description
          example: Ergonomic wireless mouse with USB receiver
        price:
          type: number
          format: double
          description: Product price in USD
          example: 29.99
        stock:
          type: integer
          description: Available stock quantity
          example: 100
        category:
          type: string
          description: Product category
          example: Electronics
        imageUrl:
          type: string
          format: uri
          description: Product image URL
          example: https://example.com/images/mouse.jpg
        active:
          type: boolean
          description: Product active status
          example: true
        createdAt:
          type: string
          format: date-time
          description: Product creation timestamp
          example: 2026-08-01T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: Product last update timestamp
          example: 2026-08-03T14:30:00Z

    # ==========================================
    # Order Schemas
    # ==========================================
    
    OrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          description: List of order items
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderItemRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          description: MongoDB ObjectId of the product
          example: 507f1f77bcf86cd799439011
        quantity:
          type: integer
          minimum: 1
          description: Quantity to order
          example: 2

    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Order ID
          example: 1
        userId:
          type: integer
          format: int64
          description: User ID (from JWT token)
          example: 1
        userEmail:
          type: string
          format: email
          description: User email (from JWT token)
          example: john.doe@example.com
        items:
          type: array
          description: Order items
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          type: number
          format: double
          description: Total order amount in USD
          example: 89.97
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
          description: Order creation timestamp
          example: 2026-08-03T15:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: Order last update timestamp
          example: 2026-08-03T15:00:00Z

    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Order item ID
          example: 1
        productId:
          type: string
          description: MongoDB ObjectId of the product
          example: 507f1f77bcf86cd799439011
        productName:
          type: string
          description: Product name (fetched from Catalog Service)
          example: Wireless Mouse
        price:
          type: number
          format: double
          description: Product price at time of order
          example: 29.99
        quantity:
          type: integer
          description: Quantity ordered
          example: 2
        subtotal:
          type: number
          format: double
          description: Subtotal (price * quantity)
          example: 59.98

    OrderStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - SHIPPED
        - DELIVERED
        - CANCELLED
      description: Order status
      example: PENDING

    # ==========================================
    # Error Schemas
    # ==========================================
    
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: 2026-08-03T15:00:00Z
        status:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Error type
          example: Bad Request
        message:
          type: string
          description: Error message
          example: Email already exists
        path:
          type: string
          description: Request path
          example: /api/auth/register

    RateLimitError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: 2026-08-03T15:00:00Z
        status:
          type: integer
          description: HTTP status code
          example: 429
        error:
          type: string
          description: Error type
          example: Too Many Requests
        message:
          type: string
          description: Rate limit error message
          example: Rate limit exceeded. Please try again later.
        path:
          type: string
          description: Request path
          example: /api/auth/register
        retryAfter:
          type: integer
          description: Seconds until rate limit resets
          example: 1

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from `/api/auth/login` or `/api/auth/register` endpoints.
        
        **Token Format:** `Bearer <token>`
        
        **Token Expiration:** 24 hours
        
        **User Context Propagation:**
        The gateway automatically extracts user information from the JWT token and adds the following headers to downstream service requests:
        - `X-User-Id`: User ID from token subject
        - `X-User-Email`: User email from token claims
        - `X-User-Roles`: User roles from token claims
        
        **Example:**
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        ```

x-gateway-config:
  description: API Gateway Configuration Details
  routing:
    auth-service:
      path: /api/auth/**
      target: lb://auth-service
      port: 8081
      stripPrefix: 2
      rateLimit:
        replenishRate: 10
        burstCapacity: 20
    catalog-service:
      path: /api/catalog/**
      target: lb://catalog-service
      port: 8082
      stripPrefix: 2
      rateLimit:
        replenishRate: 50
        burstCapacity: 100
    order-service:
      path: /api/orders/**
      target: lb://order-service
      port: 8083
      stripPrefix: 2
      rateLimit:
        replenishRate: 20
        burstCapacity: 40
  filters:
    - name: JwtAuthenticationFilter
      description: Validates JWT tokens and propagates user context
      publicPaths:
        - /api/auth/login
        - /api/auth/register
        - /actuator/health
    - name: RequestRateLimiter
      description: Redis-backed token bucket rate limiting
      keyResolver: userKeyResolver (uses X-User-Id or IP address)
    - name: DedupeResponseHeader
      description: Removes duplicate CORS headers
  cors:
    allowedOrigins: "*"
    allowedMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowedHeaders: "*"
  redis:
    host: localhost
    port: 6379
    usage:
      - Rate limiting token buckets
      - Distributed tracing context
  monitoring:
    endpoints:
      - /actuator/health
      - /actuator/prometheus
      - /actuator/metrics
    tracing:
      enabled: true
      samplingProbability: 1.0
      propagation: B3 (traceId, spanId, parentSpanId)
