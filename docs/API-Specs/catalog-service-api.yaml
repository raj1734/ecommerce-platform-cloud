openapi: 3.0.3
info:
  title: Catalog Service API
  description: Product Catalog Management Service for E-Commerce Platform
  version: 1.0.0
  contact:
    name: E-Commerce Platform Team
    email: team@ecommerce.com

servers:
  - url: http://localhost:8082
    description: Local development
  - url: http://localhost:8080/api/catalog
    description: Via API Gateway (local)

tags:
  - name: Products
    description: Product catalog operations

paths:
  /api/products:
    get:
      tags:
        - Products
      summary: Get all products
      description: Retrieve all active products (cached)
      operationId: getAllProducts
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      tags:
        - Products
      summary: Create new product
      description: Add a new product to the catalog
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      description: Retrieve a specific product (cached)
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 64f1a2b3c4d5e6f7g8h9i0j1
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Products
      summary: Update product
      description: Update an existing product
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

    delete:
      tags:
        - Products
      summary: Delete product
      description: Soft delete a product (sets active=false)
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Product deleted successfully
        '404':
          description: Product not found

  /api/products/category/{category}:
    get:
      tags:
        - Products
      summary: Get products by category
      description: Retrieve all products in a specific category (cached)
      operationId: getProductsByCategory
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
          example: Electronics
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /api/products/search:
    get:
      tags:
        - Products
      summary: Search products
      description: Search products by name
      operationId: searchProducts
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          example: laptop
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          example: 64f1a2b3c4d5e6f7g8h9i0j1
        name:
          type: string
          example: Laptop
        description:
          type: string
          example: High-performance laptop
        price:
          type: number
          format: decimal
          example: 999.99
        stock:
          type: integer
          example: 50
        category:
          type: string
          example: Electronics
        imageUrl:
          type: string
          example: https://example.com/laptop.jpg
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductRequest:
      type: object
      required:
        - name
        - price
        - stock
        - category
      properties:
        name:
          type: string
          example: Laptop
        description:
          type: string
          example: High-performance laptop
        price:
          type: number
          format: decimal
          minimum: 0.01
          example: 999.99
        stock:
          type: integer
          minimum: 1
          example: 50
        category:
          type: string
          example: Electronics
        imageUrl:
          type: string
          example: https://example.com/laptop.jpg

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT