spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BROKERS:localhost:9092}}

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}
inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8086}
payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8088}
user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8087}

logging:
  level:
    root: INFO
    com.ecommerce.order: INFO
    org.hibernate.SQL: INFO

resilience4j:
  retry:
    instances:
      catalogService: {max-attempts: 3, wait-duration: 300ms}
      inventoryService: {max-attempts: 2, wait-duration: 300ms}
      paymentService: {max-attempts: 2, wait-duration: 300ms}
  circuitbreaker:
    instances:
      catalogService: {sliding-window-size: 10, minimum-number-of-calls: 5, failure-rate-threshold: 50, wait-duration-in-open-state: 10s}
      inventoryService: {sliding-window-size: 10, minimum-number-of-calls: 5, failure-rate-threshold: 50, wait-duration-in-open-state: 10s}
      paymentService: {sliding-window-size: 10, minimum-number-of-calls: 5, failure-rate-threshold: 50, wait-duration-in-open-state: 10s}
