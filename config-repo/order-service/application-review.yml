# Order Service - Review Environment Configuration
# For code review and PR testing (H2 in-memory)

spring:
  datasource:
    url: jdbc:h2:mem:order_db
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    root: INFO
    com.ecommerce.order: DEBUG