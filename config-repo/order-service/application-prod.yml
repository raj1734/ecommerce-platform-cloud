spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/order_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://catalog-service.dev.ecommerce.local:8082}
inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://inventory-service.dev.ecommerce.local:8086}
payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://payment-service.dev.ecommerce.local:8088}
user:
  service:
    url: ${USER_SERVICE_URL:http://user-service.dev.ecommerce.local:8087}

logging:
  level:
    root: INFO
    com.ecommerce.order: INFO

resilience4j:
  retry:
    instances:
      catalogService: {max-attempts: 3, wait-duration: 300ms}
      inventoryService: {max-attempts: 2, wait-duration: 300ms}
      paymentService: {max-attempts: 2, wait-duration: 300ms}
  circuitbreaker:
    instances:
      catalogService: {sliding-window-size: 10, minimum-number-of-calls: 5, failure-rate-threshold: 50, wait-duration-in-open-state: 10s}
      inventoryService: {sliding-window-size: 10, minimum-number-of-calls: 5, failure-rate-threshold: 50, wait-duration-in-open-state: 10s}
      paymentService: {sliding-window-size: 10, minimum-number-of-calls: 5, failure-rate-threshold: 50, wait-duration-in-open-state: 10s}
