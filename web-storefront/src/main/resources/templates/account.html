<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('My Account')}"></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<main class="container py-4"><h1 class="fw-bold mb-4">My Account</h1>
<div class="row g-4">
<div class="col-lg-6"><div class="card border-0 shadow-sm"><div class="card-body"><h5>Profile</h5>
<form method="post" action="/account/profile">
<input class="form-control mb-2" name="firstName" required placeholder="First name" th:value="${profile.get('firstName') != null ? profile.get('firstName').asText() : ''}">
<input class="form-control mb-2" name="lastName" placeholder="Last name" th:value="${profile.get('lastName') != null ? profile.get('lastName').asText() : ''}">
<input class="form-control mb-3" name="phone" placeholder="Phone" th:value="${profile.get('phone') != null ? profile.get('phone').asText() : ''}">
<button class="btn btn-primary">Save profile</button></form></div></div></div>
<div class="col-lg-6"><div class="card border-0 shadow-sm"><div class="card-body"><h5>Addresses</h5>
<div class="border rounded p-3 mb-2" th:each="a : ${addresses}">
<strong th:text="${a.get('addressLine1') != null ? a.get('addressLine1').asText() : ''}"></strong><br>
<span th:text="${(a.get('city') != null ? a.get('city').asText() : '') + ', ' + (a.get('state') != null ? a.get('state').asText() : '') + ' ' + (a.get('postalCode') != null ? a.get('postalCode').asText() : '')}"></span></div>
<button class="btn btn-outline-primary" data-bs-toggle="collapse" data-bs-target="#addressForm">Add address</button>
<form id="addressForm" class="collapse mt-3" method="post" action="/account/address">
<input class="form-control mb-2" name="addressLine1" placeholder="Address line 1" required><input class="form-control mb-2" name="addressLine2" placeholder="Address line 2">
<div class="row g-2"><div class="col"><input class="form-control" name="city" placeholder="City" required></div><div class="col"><input class="form-control" name="state" placeholder="State" required></div></div>
<div class="row g-2 mt-1"><div class="col"><input class="form-control" name="postalCode" placeholder="Postal code" required></div><div class="col"><input class="form-control" name="country" placeholder="Country" required></div></div>
<div class="form-check my-2"><input class="form-check-input" type="checkbox" name="isDefault" value="true"><label class="form-check-label">Default address</label></div>
<button class="btn btn-primary">Save address</button></form>
</div></div></div></div></main>
<div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
