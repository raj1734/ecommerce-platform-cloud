<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Order confirmed')}"></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5 text-center"><div class="card border-0 shadow-sm mx-auto" style="max-width:650px"><div class="card-body p-5">
<div class="display-3 text-success"><i class="bi bi-check-circle"></i></div><h1 class="fw-bold mt-3">Order confirmed</h1>
<p class="text-muted">Your checkout request was accepted by the order service.</p>
<p th:if="${order.get('orderId') != null}">Order ID: <strong th:text="${order.get('orderId').asText()}"></strong></p>
<a href="/orders" class="btn btn-primary me-2">View orders</a><a href="/products" class="btn btn-outline-secondary">Continue shopping</a>
</div></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
