<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Products')}"></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<main class="container py-4">
<div class="d-flex justify-content-between align-items-end mb-4"><div><h1 class="fw-bold">Products</h1><p class="text-muted">Browse the catalogue.</p></div></div>
<form class="row g-2 mb-4">
<div class="col-md-6"><input class="form-control" name="q" th:value="${q}" placeholder="Search by name, SKU or keyword"></div>
<div class="col-md-3"><input class="form-control" name="category" th:value="${category}" placeholder="Category"></div>
<div class="col-md-2"><select class="form-select" name="size"><option>12</option><option selected>20</option><option>48</option></select></div>
<div class="col-md-1"><button class="btn btn-primary w-100"><i class="bi bi-search"></i></button></div>
</form>
<div th:if="${#lists.isEmpty(products)}" class="alert alert-info">No products found.</div>
<div class="row g-4">
<div class="col-12 col-sm-6 col-lg-3" th:each="p : ${products}">
<div class="card product-card h-100 border-0 shadow-sm">
<div class="product-image"><img th:if="${p.get('imageUrls') != null and p.get('imageUrls').isArray() and p.get('imageUrls').size() > 0}" th:src="${p.get('imageUrls').get(0).asText()}" alt=""></div>
<div class="card-body d-flex flex-column">
<div class="small text-muted" th:text="${p.get('category') != null ? p.get('category').asText() : 'Product'}"></div>
<h5 class="card-title mt-1" th:text="${p.get('name') != null ? p.get('name').asText() : 'Unnamed product'}"></h5>
<p class="card-text text-muted small flex-grow-1" th:text="${p.get('description') != null ? p.get('description').asText() : ''}"></p>
<div class="fw-bold mb-3" th:if="${p.get('price') != null}">
<span th:text="${p.get('price').get('currency') != null ? p.get('price').get('currency').asText() : ''}"></span>
<span th:text="${p.get('price').get('amount') != null ? p.get('price').get('amount').asText() : ''}"></span>
</div>
<a class="btn btn-outline-primary w-100" th:href="@{'/products/' + ${p.get('productId') != null ? p.get('productId').asText() : p.get('id').asText()}}">View product</a>
</div></div></div>
</div>
</main><div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
