<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Sign in')}"></head>
<body class="bg-light">
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-5">
<div class="card shadow-sm border-0"><div class="card-body p-4">
<h2 class="fw-bold mb-1">Welcome back</h2><p class="text-muted mb-4">Sign in to continue shopping.</p>
<div class="alert alert-success" th:if="${param.logout}">You have been signed out.</div>
<div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form method="post" action="/login">
<label class="form-label">Username</label><input class="form-control mb-3" name="username" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-primary w-100">Sign in</button>
</form>
<div class="text-center mt-3">New customer? <a href="/register">Create account</a></div>
</div></div></div></div></div>
</body></html>
