# Auth Service - SIT Environment Configuration
# System Integration Testing environment

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:sit-db.example.com}:5432/auth_db
    username: ${DB_USERNAME:ecommerce_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.ecommerce.auth: DEBUG