spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

auth:
  bootstrap-admin:
    enabled: ${AUTH_BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:admin}

logging:
  level:
    root: INFO
    com.ecommerce.auth: INFO
    org.hibernate.SQL: INFO
