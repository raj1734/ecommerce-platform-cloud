# Auth Service - Development Environment Configuration
# Uses PostgreSQL for persistent storage during development

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    root: DEBUG
    com.ecommerce.auth: DEBUG
    org.hibernate.SQL: DEBUG

auth:
  bootstrap-admin:
    enabled: ${AUTH_BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:admin}