# Catalog Service - Pre-Production Environment Configuration
# Production-like environment for final testing

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST:pp-mongo.example.com}:27017/catalog_db
      auto-index-creation: false
  
  redis:
    host: ${REDIS_HOST:pp-redis.example.com}
    port: 6379
    password: ${REDIS_PASSWORD}
  
  cache:
    type: redis

logging:
  level:
    root: INFO
    com.ecommerce.catalog: INFO