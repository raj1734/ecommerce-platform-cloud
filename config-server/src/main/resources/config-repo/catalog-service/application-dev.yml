spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/catalog_db}
      auto-index-creation: true
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
  cache:
    type: redis

catalog:
  repository:
    type: ${CATALOG_REPOSITORY_TYPE:mongo}

logging:
  level:
    root: DEBUG
    com.ecommerce.catalog: DEBUG
    org.springframework.data.mongodb: DEBUG
