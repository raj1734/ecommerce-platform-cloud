spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/catalog_db}
      auto-index-creation: true
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    ssl:
      enabled: ${SPRING_REDIS_SSL:false}
  cache:
    type: redis

catalog:
  repository:
    type: ${CATALOG_REPOSITORY_TYPE:mongo}

logging:
  level:
    root: INFO
    com.ecommerce.catalog: INFO
    org.springframework.data.mongodb: INFO
